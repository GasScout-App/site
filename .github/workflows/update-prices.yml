# Rebuilds gas-prices/index.html (today's prices around Princeton) every day,
# shortly after the app's own price sync (sync-gas-prices runs at 11:00 UTC),
# and commits it if anything changed. Also runs by hand from the Actions tab.
#
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY - the same
# public URL and key the app ships with, so the page sees exactly what the app
# shows (hidden reports are filtered out by the database).
name: Update gas prices page

on:
  schedule:
    - cron: "30 11 * * *"   # 6:30 am New York (7:30 am in summer time)
    - cron: "30 23 * * *"   # evening refresh, picks up drivers' reports
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the page
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/build_prices_page.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No price changes."
            exit 0
          fi
          git config user.name "gasscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gas-prices/index.html sitemap.xml
          git commit -m "Update gas prices ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own token doesn't always start a Pages
      # build, so ask for one directly.
      - name: Republish the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
